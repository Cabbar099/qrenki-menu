<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRENKİ - Mətbəx & Ofisiant Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body { 
            background: #08080a; 
            color: #f1f1f5; 
            padding: 20px;
            min-height: 100vh;
        }

        /* Top Bar */
        .top-bar { 
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px; 
            background: #121215;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 18px 24px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .top-bar-info h1 { 
            margin: 0; 
            color: #ffc107; 
            font-size: 20px; 
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .top-bar-info p { 
            color: #20e070; 
            font-size: 13px; 
            margin-top: 4px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .top-bar-info p::before {
            content: '';
            width: 8px;
            height: 8px;
            background-color: #20e070;
            border-radius: 50%;
            box-shadow: 0 0 10px #20e070;
            display: inline-block;
        }

        .top-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .sound-btn {
            background: #27272a;
            color: #a1a1aa;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s, color 0.2s;
        }
        .sound-btn:active { transform: scale(0.95); }
        .sound-btn.active { 
            background: #20e070; 
            color: #000; 
            border-color: #20e070;
            box-shadow: 0 4px 15px rgba(32, 224, 112, 0.25); 
        }

        /* Grid */
        .orders-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 20px; 
        }

        /* Cards */
        .order-card { 
            background: linear-gradient(145deg, #16161a 0%, #121215 100%); 
            border-radius: 18px; 
            padding: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 6px solid #ef4444; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .order-card.status-prep { 
            border-left-color: #f59e0b; 
            background: linear-gradient(145deg, #1a1710 0%, #121215 100%); 
        }

        .order-card.status-ready { 
            border-left-color: #20e070; 
            background: linear-gradient(145deg, #101c15 0%, #121215 100%); 
        }

        .order-card.status-done { 
            border-left-color: #64748b; 
            opacity: 0.5; 
        }

        .order-card.status-paid { 
            border-left-color: #3b82f6; 
            background: linear-gradient(145deg, #0f172a 0%, #121215 100%); 
            opacity: 0.6;
        }

        /* Card Header */
        .order-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
            padding-bottom: 12px; 
            font-weight: bold; 
        }

        .table-badge { 
            background: #ffc107; 
            color: #000; 
            padding: 5px 12px; 
            border-radius: 10px; 
            font-size: 14px; 
            font-weight: 800;
        }

        .order-time { 
            color: #8e8e93; 
            font-size: 13px; 
            font-weight: 600;
        }

        /* Items */
        .order-items { 
            margin: 16px 0 12px 0; 
            padding-left: 20px; 
            color: #e4e4e7; 
        }

        .order-items li { 
            margin-bottom: 8px; 
            font-size: 15px; 
        }

        .order-items li strong {
            color: #ffffff;
        }

        /* Note Box */
        .order-note { 
            background: rgba(245, 158, 11, 0.1); 
            border: 1px dashed rgba(245, 158, 11, 0.4); 
            color: #ffc107; 
            padding: 10px 12px; 
            border-radius: 10px; 
            font-size: 13px; 
            margin: 12px 0; 
            font-weight: 600; 
        }

        /* Card Footer */
        .order-footer { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: 15px; 
            padding-top: 12px; 
            border-top: 1px dashed rgba(255, 255, 255, 0.08); 
        }

        .price-tag { 
            font-size: 16px; 
            font-weight: 800; 
            color: #20e070; 
        }

        .status-badge { 
            font-size: 12px; 
            font-weight: 800; 
            padding: 5px 10px; 
            border-radius: 8px; 
            background: rgba(239, 68, 68, 0.15); 
            color: #ef4444; 
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .order-card.status-prep .status-badge {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border-color: rgba(245, 158, 11, 0.3);
        }

        .order-card.status-ready .status-badge {
            background: rgba(32, 224, 112, 0.15);
            color: #20e070;
            border-color: rgba(32, 224, 112, 0.3);
        }

        .order-card.status-paid .status-badge {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border-color: rgba(59, 130, 246, 0.3);
        }

        /* Buttons */
        .btn-group { 
            display: flex; 
            gap: 6px; 
            margin-top: 14px; 
            flex-wrap: wrap;
        }

        .action-btn { 
            flex: 1; 
            min-width: 70px;
            padding: 8px 4px; 
            border: none; 
            border-radius: 10px; 
            font-weight: 800; 
            cursor: pointer; 
            font-size: 11px; 
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .action-btn:active { 
            transform: scale(0.95); 
        }

        .btn-prep { background: #f59e0b; color: #000; }
        .btn-ready { background: #20e070; color: #000; }
        .btn-done { background: #3a3a3c; color: #aaa; }
        .btn-paid { background: #3b82f6; color: #fff; }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="top-bar-info">
        <h1>👨‍🍳 Mətbəx & Ofisiant Canlı Sifariş Paneli</h1>
        <p>Canlı yenilənmə aktivdir</p>
    </div>
    
    <div class="top-controls">
        <button class="sound-btn" id="soundToggleBtn" onclick="toggleAudio()">
            🔕 Səs Deaktivdir
        </button>
        
        <!-- Dinamik Açıq / Bağlı Düyməsi -->
        <button id="systemStatusBtn" class="sound-btn" style="background: #ef4444; color: #fff; border-color: #ef4444;" onclick="toggleSystemDay()">
            🌙 Günü Bitir (Bağla)
        </button>
    </div>
</div>

<div class="orders-grid" id="orders-container"></div>

<script>
    let audioCtx = null;
    let isAudioEnabled = false;
    let previousOrderCount = null;
    let isSystemActive = true;

    // Backend-dən sistemin açıq və ya bağlı olduğunu sorğulayır
    function checkSystemStatus() {
        fetch('/api/system-status')
            .then(res => res.json())
            .then(data => {
                isSystemActive = data.active;
                const btn = document.getElementById('systemStatusBtn');
                if (isSystemActive) {
                    btn.innerText = '🌙 Günü Bitir (Bağla)';
                    btn.style.background = '#ef4444';
                    btn.style.borderColor = '#ef4444';
                    btn.style.color = '#fff';
                } else {
                    btn.innerText = '☀️ Yeni Günü Başlat (Aç)';
                    btn.style.background = '#22c55e';
                    btn.style.borderColor = '#22c55e';
                    btn.style.color = '#000';
                }
            });
    }

    // Günü Bitirmək və ya Yeni Günü Başlatmaq funksiyası
    function toggleSystemDay() {
        if (isSystemActive) {
            if (confirm("Günün sonunda bütün sifarişləri sıfırlayıb sistemi BAĞLAMAQ istədiyinizdən əminsiniz?")) {
                fetch('/api/reset-day', { method: 'POST' })
                    .then(res => res.json())
                    .then(data => {
                        alert(data.message);
                        checkSystemStatus();
                        fetchOrders();
                    });
            }
        } else {
            if (confirm("Yeni iş gününü başlatmaq və sistemi sifarişlərə AÇMAQ istəyirsiniz?")) {
                fetch('/api/start-day', { method: 'POST' })
                    .then(res => res.json())
                    .then(data => {
                        alert(data.message);
                        checkSystemStatus();
                        fetchOrders();
                    });
            }
        }
    }

    function toggleAudio() {
        const btn = document.getElementById('soundToggleBtn');

        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        isAudioEnabled = !isAudioEnabled;

        if (isAudioEnabled) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            btn.innerText = '🔔 Səs Aktivdir';
            btn.classList.add('active');
        } else {
            btn.innerText = '🔕 Səs Deaktivdir';
            btn.classList.remove('active');
        }
    }

    function playNotificationSound() {
        if (!isAudioEnabled || !audioCtx) return;

        let now = audioCtx.currentTime;
        
        [880, 1200].forEach((freq, i) => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.value = freq;

            gain.gain.setValueAtTime(0.3, now + i * 0.15);
            gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.2);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now + i * 0.15);
            osc.stop(now + i * 0.15 + 0.2);
        });
    }

    function fetchOrders() {
        fetch('/api/orders')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('orders-container');
                container.innerHTML = '';

                if (previousOrderCount !== null && data.length > previousOrderCount) {
                    playNotificationSound();
                }
                previousOrderCount = data.length;

                data.slice().reverse().forEach(order => {
                    let itemsHtml = order.items.map(item => `<li><strong>${item.name}</strong> - ${item.price} AZN</li>`).join('');

                    let cardClass = '';
                    if (order.status.includes('Hazırlanır')) cardClass = 'status-prep';
                    if (order.status.includes('Hazırdır')) cardClass = 'status-ready';
                    if (order.status.includes('Tamamlandı')) cardClass = 'status-done';
                    if (order.status.includes('Ödənildi')) cardClass = 'status-paid';

                    let noteHtml = '';
                    if (order.note && String(order.note).trim() !== "") {
                        noteHtml = `<div class="order-note">📝 <strong>Qeyd:</strong> ${order.note}</div>`;
                    }

                    container.innerHTML += `
                        <div class="order-card ${cardClass}">
                            <div class="order-header">
                                <span class="table-badge">📍 Masa №${order.table_number}</span>
                                <span class="order-time">⏰ ${order.time}</span>
                            </div>
                            <ul class="order-items">${itemsHtml}</ul>
                            ${noteHtml}
                            <div class="order-footer">
                                <span class="price-tag">Cəmi: ${order.total_price} AZN</span>
                                <span class="status-badge">${order.status}</span>
                            </div>
                            <div class="btn-group">
                                <button class="action-btn btn-prep" onclick="updateStatus(${order.id}, 'Hazırlanır 🍳')">🍳 Hazırlanır</button>
                                <button class="action-btn btn-ready" onclick="updateStatus(${order.id}, 'Hazırdır 🚀')">🚀 Hazırdır</button>
                                <button class="action-btn btn-done" onclick="updateStatus(${order.id}, 'Tamamlandı ✅')">✅ Təhvil</button>
                                <button class="action-btn btn-paid" onclick="updateStatus(${order.id}, 'Ödənildi 💳')">💳 Ödənildi</button>
                            </div>
                        </div>
                    `;
                });
            });
    }

    function updateStatus(orderId, newStatus) {
        fetch('/api/order/status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order_id: orderId, status: newStatus })
        }).then(() => fetchOrders());
    }

    // İlk yüklənmə
    checkSystemStatus();
    fetchOrders();
    setInterval(fetchOrders, 3000);
</script>

</body>
</html>
